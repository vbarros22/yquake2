name: Wii U

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  DEVKITPRO: /opt/devkitpro
  DEVKITPPC: /opt/devkitpro/devkitPPC
  # CafeGLSL comes prebuilt from the gx2gl SDK (it takes long to build);
  # gx2gl itself is built from its branch, so its fixes arrive right away.
  GX2GL_SDK_URL: https://github.com/vbarros22/gx2gl/releases/download/sdk-v0.1.0-gs/gx2gl-sdk.tar.gz
  GX2GL_REPOSITORY: vbarros22/gx2gl
  GX2GL_REF: geometry-shaders
  CAFEGLSL_REPOSITORY: vbarros22/CafeGLSL
  CAFEGLSL_REF: geometry-shaders

jobs:
  wiiu:
    name: Wii U (.wuhb)
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - name: Install dependencies
        run: |
          rm -f /etc/apt/sources.list.d/devkitpro.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl cmake ninja-build
          # The devkitPro package mirror is sometimes slow to answer.
          for i in 1 2 3 4 5; do
            dkp-pacman -Sy --noconfirm --needed wiiu-sdl2 && break
            sleep 20
          done
          dkp-pacman -Q wiiu-sdl2

      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.GX2GL_REPOSITORY }}
          ref: ${{ env.GX2GL_REF }}
          path: deps/gx2gl

      # Only for CafeGLSLCompiler.h; the library comes from the SDK.
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CAFEGLSL_REPOSITORY }}
          ref: ${{ env.CAFEGLSL_REF }}
          path: deps/cafeglsl
          sparse-checkout: cafecompiler

      - name: Build gx2gl
        shell: bash
        run: |
          set -o pipefail
          curl -fsSL "$GX2GL_SDK_URL" -o gx2gl-sdk.tar.gz
          tar xzf gx2gl-sdk.tar.gz
          mkdir -p deps/cafeglsl/build-cafe/cafecompiler
          cp gx2gl-sdk/lib/libcafeglsl.a deps/cafeglsl/build-cafe/cafecompiler/
          {
            cmake -S deps/gx2gl -B build-gx2gl -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/WiiU.cmake" \
              -DCMAKE_BUILD_TYPE=Release \
              -DGX2GL_CAFEGLSL_ROOT="$PWD/deps/cafeglsl" &&
            cmake --build build-gx2gl --target gl33_gx2_core
          } 2>&1 | tee ci-build.log
          # Same layout as the SDK, with the fresh gx2gl.
          rm -rf gx2gl-sdk/include && cp -r deps/gx2gl/include gx2gl-sdk/include
          cp "$(find build-gx2gl -name libgl33_gx2_core.a | head -1)" gx2gl-sdk/lib/

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          {
            cmake -S wiiu -B build-wiiu -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/WiiU.cmake" \
              -DCMAKE_BUILD_TYPE=Release \
              -DGX2GL_SDK="$PWD/gx2gl-sdk" &&
            cmake --build build-wiiu -- -k 0
          } 2>&1 | tee -a ci-build.log
          mkdir -p artifacts
          cp build-wiiu/yquake2.wuhb build-wiiu/yquake2.rpx build-wiiu/yquake2.elf wiiu/README.md artifacts/

      - name: Report failure as annotations
        if: failure()
        shell: bash
        run: |
          f=ci-build.log
          [ -f "$f" ] || exit 0
          # Long command lines would use up the annotation, so cut them.
          cut -c1-400 "$f" | grep -v "^\[[0-9]*/[0-9]*\] Building" > ci-short.log || true
          { grep -n -B2 -A12 -E "error|Error |FAILED|undefined reference|multiple definition" ci-short.log | head -150
            echo "----- tail -----"; tail -40 ci-short.log; } > ci-excerpt.txt || true
          msg=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' ci-excerpt.txt | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=$f::$msg"

      - uses: actions/upload-artifact@v4
        with:
          name: yquake2-wiiu
          path: artifacts/
          if-no-files-found: error
